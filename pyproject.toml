[project]
name = "ai-engineer-roadmap"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "fayazahamedofficial", email = "your-new-account-email@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "google-genai>=2.16.0",
    "groq>=1.6.0",
    "jupyter>=1.1.1",
    "kagglehub>=1.0.2",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
]

[project.scripts]
ai-engineer-roadmap = "ai_engineer_roadmap:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]
